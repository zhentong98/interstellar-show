<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0907" />
    <title>星际穿越 · 电影交响音乐会</title>
    <meta name="description" content="在浏览器里看一场《星际穿越》电影交响音乐会：巨幕播放电影片段，乐团在银幕下现场演奏。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;600&display=swap"
    />
  </head>
  <body>
    <!-- 3D 音乐厅：CSS3D 层（巨幕视频）在下，WebGL 层在上 -->
    <div id="show" class="show"></div>
    <!-- 演出中的控制条和提示 -->
    <div id="controls" class="controls" hidden></div>
    <!-- 节目单（选歌页） -->
    <main id="programme" class="programme"></main>
    <!-- 节目单背面（散场） -->
    <section id="backpage" class="backpage" hidden></section>
    <noscript>这场演出需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
